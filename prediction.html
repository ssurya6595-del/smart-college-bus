<script>
function predictBus() {
    let bus = document.getElementById("bus").value;
    let stop = document.getElementById("stop").value;

    let data = busData.find(item =>
        item.bus === bus && item.stop === stop
    );

    document.getElementById("result").style.display = "block";

    if (data) {
        document.getElementById("result").innerHTML =
            "🚌 <strong>" + bus + "</strong><br><br>" +
            "📍 Stop: <strong>" + stop + "</strong><br><br>" +
            "⏱️ Travel time: <strong>Not available yet</strong><br><br>" +
            "🤖 AI prediction: <strong>Waiting for travel data</strong>";
    } else {
        document.getElementById("result").innerHTML =
            "No data found for this stop.";
    }
}
