<!DOCTYPE html>
<html>
<head>
    <title>Van 10 Live Tracking</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Leaflet Map -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            padding: 20px;
        }

        .header {
            background: #1e3a8a;
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .card {
            background: white;
            margin-top: 20px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .location {
            font-size: 18px;
            line-height: 1.8;
        }

        .info-box {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
        }

        .current-stop {
            color: #15803d;
            font-weight: bold;
        }

        .next-stop {
            color: #1d4ed8;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            background: #1e3a8a;
            color: white;
        }

        #map {
            width: 100%;
            height: 400px;
            margin-top: 20px;
            border-radius: 12px;
        }

        .route-list {
            margin-top: 15px;
            padding-left: 20px;
        }

        .route-list li {
            padding: 7px 0;
        }

        .passed-stop {
            color: #888;
        }

        .upcoming-stop {
            color: #111;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>📍 Van 10 Tracking</h1>
        <p>Smart College Bus</p>
    </div>

    <div class="card">

        <h2>🚐 Current Van</h2>

        <div class="location">

            <p>
                Van Number:
                <strong>Van 10</strong>
            </p>

            <p>
                Status:
                <strong id="tripStatus">Checking...</strong>
            </p>

            <p>
                Latitude:
                <strong id="latitude">--</strong>
            </p>

            <p>
                Longitude:
                <strong id="longitude">--</strong>
            </p>

        </div>

        <!-- Current and Next Stop -->
        <div class="info-box">

            <p>
                📍 Current Stop:
                <span id="currentStop" class="current-stop">
                    Waiting...
                </span>
            </p>

            <p>
                ➡️ Next Stop:
                <span id="nextStop" class="next-stop">
                    Waiting...
                </span>
            </p>

            <p>
                🛣️ Stops Remaining:
                <strong id="stopsRemaining">--</strong>
            </p>

        </div>

        <button onclick="getVanLocation()">
            📍 Get Current Location
        </button>

        <div id="map"></div>

    </div>


    <!-- Route List -->
    <div class="card">

        <h2>🛣️ Van 10 Route</h2>

        <ol id="routeList" class="route-list"></ol>

    </div>


    <script>

        /* ==============================
           SUPABASE
        ============================== */

        const SUPABASE_URL =
            "https://kztpuvxjwiacekjflget.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_k-IFp2mb39LTnOL6EPML4w_bb7oUP-h";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* ==============================
           VAN 10 ROUTE - 19 STOPS
        ============================== */

        const routeStops = [

            {
                name: "Guddur",
                lat: 12.9032238,
                lng: 78.4614818
            },

            {
                name: "P Guddur",
                lat: 12.9024623,
                lng: 78.4552956
            },

            {
                name: "Rajupet Road",
                lat: 12.9172295,
                lng: 78.4475890
            },

            {
                name: "Nagakuppa",
                lat: 12.9250877,
                lng: 78.4395306
            },

            {
                name: "Srinivasa Sandra",
                lat: 12.9181301,
                lng: 78.4302529
            },

            {
                name: "Melupalli",
                lat: 12.9193513,
                lng: 78.4228919
            },

            {
                name: "Yaragunte Stop 1",
                lat: 12.9158122,
                lng: 78.4190157
            },

            {
                name: "Yaragunte Stop 2",
                lat: 12.9150112,
                lng: 78.4163389
            },

            {
                name: "SVS School",
                lat: 12.9154769,
                lng: 78.4144459
            },

            {
                name: "Bennavara",
                lat: 12.9177024,
                lng: 78.4117443
            },

            {
                name: "Chowdehalli",
                lat: 12.9261671,
                lng: 78.4144962
            },

            {
                name: "Karadaguru",
                lat: 12.9380423,
                lng: 78.4042854
            },

            {
                name: "Nakkanahalli",
                lat: 12.9447200,
                lng: 78.3926081
            },

            {
                name: "Kogilahalli",
                lat: 12.9518235,
                lng: 78.3857610
            },

            {
                name: "Kuruburu",
                lat: 12.9494327,
                lng: 78.3730856
            },

            {
                name: "Kyasamballi",
                lat: 12.9550093,
                lng: 78.3471329
            },

            {
                name: "Baluvanahalli",
                lat: 12.9668841,
                lng: 78.3427461
            },

            {
                name: "Bethamangala",
                lat: 13.0024072,
                lng: 78.3323351
            },

            {
                name: "Sri Sai PU Degree College",
                lat: 13.0025565,
                lng: 78.3440115
            }

        ];


        /* ==============================
           CREATE MAP
        ============================== */

        const map =
            L.map("map").setView(
                [12.914148, 78.4204467],
                14
            );


        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution: "&copy; OpenStreetMap"
            }
        ).addTo(map);


        /* ==============================
           DRAW ROUTE
        ============================== */

        const routeCoordinates =
            routeStops.map(
                stop => [stop.lat, stop.lng]
            );


        const routeLine =
            L.polyline(
                routeCoordinates,
                {
                    weight: 5
                }
            ).addTo(map);


        /* ==============================
           ADD STOP MARKERS
        ============================== */

        routeStops.forEach(
            function(stop, index) {

                const marker =
                    L.marker(
                        [stop.lat, stop.lng]
                    )
                    .addTo(map);

                marker.bindPopup(
                    "🛑 Stop " +
                    (index + 1) +
                    "<br>" +
                    stop.name
                );

            }
        );


        /* ==============================
           SHOW ROUTE LIST
        ============================== */

        function showRouteList() {

            const list =
                document.getElementById(
                    "routeList"
                );

            list.innerHTML = "";

            routeStops.forEach(
                function(stop, index) {

                    const li =
                        document.createElement("li");

                    li.textContent =
                        (index + 1) +
                        ". " +
                        stop.name;

                    li.className =
                        "upcoming-stop";

                    list.appendChild(li);

                }
            );

        }


        showRouteList();


        /* ==============================
           VAN MARKER
        ============================== */

        let vanMarker = null;


        /* ==============================
           DISTANCE FUNCTION
        ============================== */

        function calculateDistance(
            lat1,
            lon1,
            lat2,
            lon2
        ) {

            const R = 6371;

            const dLat =
                (lat2 - lat1) *
                Math.PI / 180;

            const dLon =
                (lon2 - lon1) *
                Math.PI / 180;

            const a =
                Math.sin(dLat / 2) *
                Math.sin(dLat / 2) +

                Math.cos(
                    lat1 *
                    Math.PI / 180
                ) *

                Math.cos(
                    lat2 *
                    Math.PI / 180
                ) *

                Math.sin(dLon / 2) *
                Math.sin(dLon / 2);

            const c =
                2 *
                Math.atan2(
                    Math.sqrt(a),
                    Math.sqrt(1 - a)
                );

            return R * c;

        }


        /* ==============================
           FIND CURRENT / NEXT STOP
        ============================== */

        function updateStopInformation(
            latitude,
            longitude
        ) {

            let nearestIndex = 0;
            let nearestDistance =
                Infinity;


            routeStops.forEach(
                function(stop, index) {

                    const distance =
                        calculateDistance(
                            latitude,
                            longitude,
                            stop.lat,
                            stop.lng
                        );

                    if (
                        distance <
                        nearestDistance
                    ) {

                        nearestDistance =
                            distance;

                        nearestIndex =
                            index;

                    }

                }
            );


            const currentStop =
                routeStops[nearestIndex];


            document.getElementById(
                "currentStop"
            ).textContent =
                currentStop.name;


            if (
                nearestIndex <
                routeStops.length - 1
            ) {

                document.getElementById(
                    "nextStop"
                ).textContent =
                    routeStops[
                        nearestIndex + 1
                    ].name;

            } else {

                document.getElementById(
                    "nextStop"
                ).textContent =
                    "College reached 🎓";

            }


            const remaining =
                routeStops.length -
                nearestIndex -
                1;


            document.getElementById(
                "stopsRemaining"
            ).textContent =
                remaining;


            /* Update route list */

            const list =
                document.getElementById(
                    "routeList"
                );

            const items =
                list.children;


            for (
                let i = 0;
                i < items.length;
                i++
            ) {

                if (
                    i < nearestIndex
                ) {

                    items[i].className =
                        "passed-stop";

                }

                else if (
                    i === nearestIndex
                ) {

                    items[i].className =
                        "current-stop";

                }

                else {

                    items[i].className =
                        "upcoming-stop";

                }

            }

        }


        /* ==============================
           DISPLAY VAN LOCATION
        ============================== */

        function displayVanLocation(
            latitude,
            longitude
        ) {

            document.getElementById(
                "latitude"
            ).textContent =
                latitude;

            document.getElementById(
                "longitude"
            ).textContent =
                longitude;


            updateStopInformation(
                latitude,
                longitude
            );


            map.setView(
                [latitude, longitude],
                16
            );


            if (
                vanMarker === null
            ) {

                vanMarker =
                    L.marker(
                        [latitude, longitude]
                    )
                    .addTo(map)
                    .bindPopup(
                        "🚐 Van 10"
                    )
                    .openPopup();

            }

            else {

                vanMarker.setLatLng(
                    [latitude, longitude]
                );

            }

        }


        /* ==============================
           GET LATEST VAN LOCATION
        ============================== */

        async function getVanLocation() {

            const {
                data,
                error
            } =
                await supabaseClient
                .from("van_locations")
                .select(
                    "latitude, longitude, updated_at"
                )
                .eq(
                    "van_number",
                    "Van 10"
                )
                .order(
                    "updated_at",
                    {
                        ascending: false
                    }
                )
                .limit(1);


            if (error) {

                alert(
                    "❌ Could not get Van 10 location.\n\n" +
                    error.message
                );

                return;

            }


            if (
                !data ||
                data.length === 0
            ) {

                alert(
                    "⚠️ No Van 10 location available yet."
                );

                return;

            }


            const latitude =
                Number(data[0].latitude);

            const longitude =
                Number(data[0].longitude);


            displayVanLocation(
                latitude,
                longitude
            );

        }


        /* ==============================
           TRIP STATUS
        ============================== */

        async function showTripStatus() {

            const {
                data,
                error
            } =
                await supabaseClient
                .from("van_status")
                .select(
                    "status, updated_at"
                )
                .eq(
                    "van_number",
                    "Van 10"
                )
                .order(
                    "updated_at",
                    {
                        ascending: false
                    }
                )
                .limit(1);


            if (error) {

                document.getElementById(
                    "tripStatus"
                ).textContent =
                    "⚠️ Status unavailable";

                return;

            }


            if (
                !data ||
                data.length === 0
            ) {

                document.getElementById(
                    "tripStatus"
                ).textContent =
                    "⚪ Trip Not Started";

                return;

            }


            if (
                data[0].status ===
                "Trip Started"
            ) {

                document.getElementById(
                    "tripStatus"
                ).textContent =
                    "🟢 Trip Started";

            }

            else if (
                data[0].status ===
                "Trip Ended"
            ) {

                document.getElementById(
                    "tripStatus"
                ).textContent =
                    "🔴 Trip Ended";

            }

            else {

                document.getElementById(
                    "tripStatus"
                ).textContent =
                    "⚪ Trip Not Started";

            }

        }


        /* ==============================
           LOAD INITIAL DATA
        ============================== */

        getVanLocation();

        showTripStatus();


        /* ==============================
           REALTIME LIVE LOCATION
        ============================== */

        supabaseClient
            .channel(
                "van10-live-location"
            )
            .on(
                "postgres_changes",
                {
                    event: "INSERT",
                    schema: "public",
                    table: "van_locations",
                    filter:
                        "van_number=eq.Van 10"
                },

                function(payload) {

                    const latitude =
                        Number(
                            payload.new.latitude
                        );

                    const longitude =
                        Number(
                            payload.new.longitude
                        );


                    displayVanLocation(
                        latitude,
                        longitude
                    );


                    console.log(
                        "Van 10 moved:",
                        latitude,
                        longitude
                    );

                }
            )
            .subscribe();


        /* ==============================
           REFRESH TRIP STATUS
        ============================== */

        setInterval(
            showTripStatus,
            5000
        );

    </script>

</body>
</html>
