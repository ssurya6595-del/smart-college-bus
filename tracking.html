<!DOCTYPE html>
<html>
<head>
    <title>Van 10 Live Tracking</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            padding: 20px;
        }

        .header {
            background: #1e3a8a;
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .card {
            background: white;
            margin-top: 20px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .location {
            font-size: 18px;
            line-height: 1.8;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            background: #1e3a8a;
            color: white;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>📍 Van 10 Tracking</h1>
        <p>Smart College Bus</p>
    </div>

    <div class="card">
        <h2>🚐 Current Van</h2>

        <div class="location">
            <p>Van Number: <strong>Van 10</strong></p>
            <p>Status: <strong id="tripStatus">Checking...</strong></p>
            <p>Latitude: <strong id="latitude">--</strong></p>
<p>Longitude: <strong id="longitude">--</strong></p>
        </div>

        <button onclick="getVanLocation()">
            📍 Get Current Location
        </button>
    </div>

    <script>
const SUPABASE_URL = "https://kztpuvxjwiacekjflget.supabase.co";
const SUPABASE_KEY = "sb_publishable_k-IFp2mb39LTnOL6EPML4w_bb7oUP-h";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function getVanLocation() {
    const { data, error } = await supabaseClient
        .from("van_locations")
        .select("latitude, longitude, updated_at")
        .eq("van_number", "Van 10")
        .order("updated_at", { ascending: false })
        .limit(1);

    if (error) {
        alert("❌ Could not get Van 10 location.\n\n" + error.message);
        return;
    }

    if (data.length === 0) {
        alert("⚠️ No Van 10 location available yet.");
        return;
    }

    document.getElementById("latitude").textContent = data[0].latitude;
    document.getElementById("longitude").textContent = data[0].longitude;
}

function showTripStatus() {
    let status = localStorage.getItem("van10Status");

    if (status === "Trip Started") {
        document.getElementById("tripStatus").textContent = "🟢 Trip Started";
    }
    else if (status === "Trip Ended") {
        document.getElementById("tripStatus").textContent = "🔴 Trip Ended";
    }
    else {
        document.getElementById("tripStatus").textContent = "⚪ Trip Not Started";
    }
}

showTripStatus();
</script>

</body>
</html>
