<!DOCTYPE html>
<html>
<head>
    <title>Manage Drivers</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            padding: 20px;
        }

        .header {
            background: #1e3a8a;
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .driver {
            background: white;
            margin-top: 15px;
            padding: 18px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            background: #1e3a8a;
            color: white;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>👨‍✈️ Manage Drivers</h1>
        <p>Smart College Bus</p>
    </div>

    <div class="driver">
        <h2>Driver 1</h2>
        <p>🚐 Assigned Van: Van 10</p>
        <p>🟢 Status: Active</p>
    </div>

    <div class="driver">
        <h2>Driver Management</h2>
        <p>More drivers can be added later.</p>
    </div>

</body>
</html>
