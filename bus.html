<!DOCTYPE html>
<html>
<head>
    <title>Bus Information</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        .header {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .card h2 {
            margin-top: 0;
        }

        .info {
            margin: 12px 0;
            font-size: 17px;
        }

        .status {
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🚌 Bus Information</h1>
        <p>Smart College Bus</p>
    </div>

    <div class="card">

        <h2>🚌 Bus 101</h2>

        <div class="info">
            📍 Route: Kolar → College
        </div>

        <div class="info">
            🚏 Stops: Kolar → Bethamangala → College
        </div>

        <div class="info">
            🕐 Departure: 8:00 AM
        </div>

        <div class="info">
            📌 Status: <span class="status">On Route</span>
        </div>

    </div>

    <div class="card">

        <h2>⏱️ Next Arrival</h2>

        <div class="info">
            Estimated arrival: <strong>15 minutes</strong>
        </div>

    </div>

</div>

</body>
</html>
