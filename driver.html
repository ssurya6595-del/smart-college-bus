<!DOCTYPE html>
<html>
<head>
    <title>Driver Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            padding: 20px;
        }

        .header {
            background: #1e3a8a;
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .card {
            background: white;
            margin-top: 20px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            background: #1e3a8a;
            color: white;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🚐 Driver Dashboard</h1>
        <p>Smart College Bus</p>
    </div>

    <div class="card">
        <h2>Driver Information</h2>
        <p>Driver: Not assigned</p>
        <p>Van: Van 10</p>
        <p>Route: Van 10 Route</p>
    </div>

    <div class="card">
        <h2>Driver Controls</h2>

        <button onclick="startTrip()">🟢 Start Trip</button>
        <button onclick="endTrip()">🔴 End Trip</button>
      <select id="stopName" style="width:100%; padding:14px; margin-top:10px; border-radius:10px; font-size:16px;">
    <option value="">Select Reached Stop</option>
    <option>Guddur</option>
    <option>P Guddur</option>
    <option>Rajupet Road</option>
    <option>Nagakuppa</option>
    <option>Srinivasa Sandra</option>
    <option>Melupalli</option>
    <option>Yaragunte Stop 1</option>
    <option>Yaragunte Stop 2</option>
    <option>Bennavara</option>
    <option>Chowdehalli</option>
    <option>Karadaguru</option>
    <option>Nakkanahalli</option>
    <option>Kogilahalli</option>
    <option>Kuruburu</option>
    <option>Kyasamballi</option>
    <option>Baluvanahalli</option>
    <option>Bethamangala</option>
    <option>Sri Sai PU Degree College</option>
</select>

<button onclick="recordStopArrival()">📍 Reached Stop</button>
        <button onclick="shareLocation()">📍 Share Location</button>
        <button onclick="window.location.href='route.html'">
    🚐 View Route
        </button>
    </div>
    <script>
      const SUPABASE_URL = "https://kztpuvxjwiacekjflget.supabase.co";
const SUPABASE_KEY = "sb_publishable_k-IFp2mb39LTnOL6EPML4w_bb7oUP-h";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
async function startTrip() {
    localStorage.setItem("van10Status", "Trip Started");

    const { error } = await supabaseClient
        .from("van_status")
        .insert({
            van_number: "Van 10",
            status: "Trip Started"
        });

    if (error) {
        alert("❌ Could not save trip status.\n\n" + error.message);
        return;
    }

    alert("🚐 Van 10 trip started!");

    startAutomaticGPS();
}
      let gpsWatchId = null;

function startAutomaticGPS() {

    if (!navigator.geolocation) {
        alert("❌ GPS is not supported on this phone.");
        return;
    }

    if (gpsWatchId !== null) {
        return;
    }

    gpsWatchId = navigator.geolocation.watchPosition(
        async function(position) {

            let latitude = position.coords.latitude;
            let longitude = position.coords.longitude;

            try {

                const response = await fetch(
                    SUPABASE_URL + "/rest/v1/van_locations",
                    {
                        method: "POST",
                        headers: {
                            "apikey": SUPABASE_KEY,
                            "Authorization": "Bearer " + SUPABASE_KEY,
                            "Content-Type": "application/json",
                            "Prefer": "return=minimal"
                        },
                        body: JSON.stringify({
                            van_number: "Van 10",
                            latitude: latitude,
                            longitude: longitude
                        })
                    }
                );

                if (!response.ok) {
                    console.log("GPS location could not be saved.");
                } else {
                    console.log(
                        "GPS updated:",
                        latitude,
                        longitude
                    );
                }

            } catch (error) {
                console.log("GPS connection error:", error.message);
            }
        },

        function(error) {
            console.log("GPS error:", error.message);
        },

        {
            enableHighAccuracy: true,
            maximumAge: 5000,
            timeout: 10000
        }
    );
      }

async function endTrip() {

    if (gpsWatchId !== null) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
    }

    localStorage.setItem("van10Status", "Trip Ended");

    const { error } = await supabaseClient
        .from("van_status")
        .insert({
            van_number: "Van 10",
            status: "Trip Ended"
        });

    if (error) {
        alert("❌ Could not save trip status.\n\n" + error.message);
        return;
    }

    alert("🛑 Van 10 trip ended!");
}
      async function recordStopArrival() {

    let stop = document.getElementById("stopName").value;

    if (stop === "") {
        alert("⚠️ Please select a stop first.");
        return;
    }

    if (!navigator.geolocation) {
        alert("❌ Location is not supported on this device.");
        return;
    }

    navigator.geolocation.getCurrentPosition(
        async function(position) {

            let latitude = position.coords.latitude;
            let longitude = position.coords.longitude;

            const { error } = await supabaseClient
                .from("stop_arrivals")
                .insert({
                    van_number: "Van 10",
                    stop_name: stop,
                    latitude: latitude,
                    longitude: longitude
                });

            if (error) {
                alert("❌ Stop arrival could not be saved.\n\n" + error.message);
                return;
            }

            alert(
                "✅ Stop arrival saved!\n\n" +
                "📍 Stop: " + stop + "\n" +
                "Latitude: " + latitude + "\n" +
                "Longitude: " + longitude
            );
        },
        function() {
            alert("❌ Location permission was not allowed.");
        }
    );
      }
      async function shareLocation() {
    if (!navigator.geolocation) {
        alert("❌ Location is not supported on this device.");
        return;
    }

    navigator.geolocation.getCurrentPosition(
        async function(position) {

            let latitude = position.coords.latitude;
            let longitude = position.coords.longitude;

            try {
                const response = await fetch(
                    SUPABASE_URL + "/rest/v1/van_locations",
                    {
                        method: "POST",
                        headers: {
                            "apikey": SUPABASE_KEY,
                            "Authorization": "Bearer " + SUPABASE_KEY,
                            "Content-Type": "application/json",
                            "Prefer": "return=minimal"
                        },
                        body: JSON.stringify({
                            van_number: "Van 10",
                            latitude: latitude,
                            longitude: longitude
                        })
                    }
                );

                if (!response.ok) {
                    const errorText = await response.text();
                    alert("❌ Location could not be saved.\n\n" + errorText);
                    return;
                }

                alert(
                    "✅ Van 10 location saved!\n\n" +
                    "Latitude: " + latitude + "\n" +
                    "Longitude: " + longitude
                );

            } catch (error) {
                alert("❌ Connection error:\n\n" + error.message);
            }
        },
        function() {
            alert("❌ Location permission was not allowed.");
        }
    );
      }
    </script>
</body>
</html>
