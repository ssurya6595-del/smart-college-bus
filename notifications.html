<!DOCTYPE html>
<html>
<head>
    <title>Notifications</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            padding: 20px;
        }

        .header {
            background: #1e3a8a;
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .notification {
            background: white;
            margin-top: 15px;
            padding: 18px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .notification h3 {
            margin-top: 0;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🔔 Notifications</h1>
        <p>Smart College Bus</p>
    </div>

    <div class="notification">
        <h3>🚐 Van 10</h3>
        <p>Van 10 route information is available.</p>
    </div>

    <div class="notification">
        <h3>📍 Route Update</h3>
        <p>Van 10 has 18 stops on its current route.</p>
    </div>

    <div class="notification">
        <h3>🎓 College</h3>
        <p>Final stop: Sri Sai PU Degree College.</p>
    </div>

</body>
</html>
